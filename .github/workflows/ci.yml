name: CI

on:
  push:
    paths: ['scripts/**', '.github/workflows/**', 'config.env', 'boot/**']
  pull_request:
    paths: ['scripts/**', '.github/workflows/**', 'config.env', 'boot/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint scripts and workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck --severity=warning --external-sources scripts/*.sh

      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

      - name: Validate config
        run: CONFIG_ENV=config.env bash scripts/config.sh >/dev/null

      - name: Check upstream endpoints are alive
        continue-on-error: true
        run: |
          # Informational: a failure here means an upstream moved.
          status=0
          while read -r url; do
            [ -n "$url" ] || continue
            code=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 30 "$url" || echo 000)
            if [ "$code" = "200" ]; then
              printf '  ok   %s\n' "$url"
            else
              printf '  %-4s %s\n' "$code" "$url"; status=1
            fi
          done <<'URLS'
          https://raw.githubusercontent.com/backslashxx/KernelSU/master/kernel/setup.sh
          https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9
          https://github.com/retiredtab/android_kernel_samsung_msm8916
          URLS
          exit "$status"
